<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4158D0"/>
      <stop offset="46%" style="stop-color:#C850C0"/>
      <stop offset="100%" style="stop-color:#FFCC70"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative puzzle grid pattern -->
  <g opacity="0.15" fill="white">
    <!-- Sudoku-style grid pattern -->
    <rect x="50" y="150" width="60" height="60" rx="4"/>
    <rect x="120" y="150" width="60" height="60" rx="4"/>
    <rect x="190" y="150" width="60" height="60" rx="4"/>
    <rect x="50" y="220" width="60" height="60" rx="4"/>
    <rect x="120" y="220" width="60" height="60" rx="4"/>
    <rect x="190" y="220" width="60" height="60" rx="4"/>
    <rect x="50" y="290" width="60" height="60" rx="4"/>
    <rect x="120" y="290" width="60" height="60" rx="4"/>
    <rect x="190" y="290" width="60" height="60" rx="4"/>

    <!-- Crossword-style pattern -->
    <rect x="950" y="320" width="50" height="50" rx="4"/>
    <rect x="1010" y="320" width="50" height="50" rx="4"/>
    <rect x="1070" y="320" width="50" height="50" rx="4"/>
    <rect x="950" y="380" width="50" height="50" rx="4" fill="#333"/>
    <rect x="1010" y="380" width="50" height="50" rx="4"/>
    <rect x="1070" y="380" width="50" height="50" rx="4"/>
    <rect x="950" y="440" width="50" height="50" rx="4"/>
    <rect x="1010" y="440" width="50" height="50" rx="4"/>
    <rect x="1070" y="440" width="50" height="50" rx="4" fill="#333"/>
  </g>

  <!-- Main text -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle">
    Fruzzled
  </text>

  <!-- Tagline -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" opacity="0.9">
    Free Online Sudoku &amp; Crossword Puzzles
  </text>

  <!-- Call to action -->
  <rect x="450" y="400" width="300" height="60" rx="30" fill="white" opacity="0.95"/>
  <text x="600" y="442" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4158D0" text-anchor="middle">
    Play Now
  </text>

  <!-- Website URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.8">
    fruzzled.ie
  </text>
</svg>
